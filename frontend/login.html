<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast — Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">
            <h1></h1>ExpresoFast</h1>
            <p class="login-subtitulo">Iniciá sesión para continuar</p>

            <form id="form-login">
                <label for="username">Usuario</label>
                <input type="text" id="username" required autocomplete="username">

                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">

                <button type="submit">Iniciar sesión</button>

                <p id="mensaje-error" class="mensaje-error" hidden></p>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensaje-error');

            try {
                const respuesta = await fetch(`${API_URL_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!respuesta.ok) {
                    mensajeError.textContent = 'Usuario o contraseña incorrectos';
                    mensajeError.hidden = false;
                    return;
                }

                const datos = await respuesta.json();

                localStorage.setItem('jwt_token', datos.token);
                localStorage.setItem('jwt_username', datos.username);
                localStorage.setItem('jwt_roles', JSON.stringify(datos.roles));

                window.location.href = 'index.html';

            } catch (error) {
                console.error('Error al iniciar sesión:', error);
                mensajeError.textContent = 'No se pudo conectar con el servidor';
                mensajeError.hidden = false;
            }
        });
    </script>

</body>
</html>
